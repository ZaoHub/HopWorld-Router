# HopWorld Router — Let's Encrypt HTTP-01 (webroot). Install to /etc/nginx/conf.d/
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 404;
    }
}
