# HopWorld Router — HTTPS 仅暴露订阅路径 /s/
# 安装：/etc/nginx/conf.d/hopworld-https-subscription.conf
# 前置：certbot 已为 DOMAIN 签发证书；hopworld-router 监听 127.0.0.1:8080（推荐）
#
# 安装前把 example.com 换成你的域名（与 HOPWORLD_PUBLIC_HOST 一致）

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        allow all;
    }

  # 其余 HTTP 不开放管理页
    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 只反代订阅（含 /s/<token>/ikev2.mobileconfig），不暴露管理界面
    location /s/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8080;

        # 降低 token 进访问日志的概率（按需再加强）
        access_log off;
    }

    location / {
        return 404;
    }
}
