# Include inside nginx's stream {} on hosts using the ssl_preread module.
# TCP 443 is owned by this stream listener. Keep the HTTPS site behind it.
# Configure HOPWORLD_ACME_TLS_PORT=10443 for lego.
map $server_addr $hopworld_loopback {
    ~:      "[::1]";
    default 127.0.0.1;
}

map $ssl_preread_alpn_protocols $hopworld_tls_port {
    ~(^|,)acme-tls/1(,|$) 10443;
    default               9443;
}

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_connect_timeout 5s;
    proxy_timeout 30s;
    proxy_pass $hopworld_loopback:$hopworld_tls_port;
}
